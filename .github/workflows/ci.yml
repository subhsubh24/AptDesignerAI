name: CI

# Runs on the real default branch (the previous config only watched main/develop,
# so CI never actually ran on this repo's PRs). `pull_request:` with no branch
# filter covers PRs into any base, including the autonomous loop's PRs.
on:
  push:
    branches: ["claude/ai-apartment-design-app-iHAdb", main, develop]
  pull_request:

jobs:
  # Required gate — branch protection requires this job to pass before merge.
  # These three are the AGENTS.md green-before-merge contract and are kept
  # green at all times.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Determinism
        run: npx --yes tsx scripts/check-determinism.ts

  # Mobile gate — the Expo app lives in /mobile and is built incrementally by the
  # autonomous loop (which cannot edit .github/, so this job is added by a human).
  # It runs the mobile type/lint/test gate when /mobile exists and passes trivially
  # before it does, so it is safe as a required check from day one.
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mobile gate (type/lint/test when /mobile exists)
        run: |
          if [ ! -f mobile/package.json ]; then
            echo "No /mobile app yet — mobile gate is a no-op (passes)."
            exit 0
          fi
          cd mobile
          echo "Installing mobile deps..."
          npm install --no-audit --no-fund
          if [ -f tsconfig.json ]; then
            echo "Type-checking..."
            npx tsc --noEmit
          else
            echo "No tsconfig.json yet — skipping type check."
          fi
          # Lint + tests are informational here. Lint is non-blocking project-wide,
          # so a mobile lint-config hiccup must NOT block a compiling app; the hard
          # gate is the `tsc --noEmit` type check above.
          npm run -s lint --if-present || echo "mobile lint: non-fatal issues (see logs)"
          npm test --if-present || echo "mobile tests: non-fatal issues (see logs)"

  # Required build gate — merges auto-deploy to Vercel production, so a change
  # that type-checks but breaks `next build` must NOT be able to auto-merge.
  # Mirrors Vercel's build with placeholder public env.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Non-blocking quality signal. Lint currently has pre-existing errors, so it is
  # informational (continue-on-error) rather than merge-gating. New code still
  # stays lint-clean because the loop lints its own diff before opening a PR.
  # (The production build is now gated by the required `build` job above.)
  quality:
    name: quality (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint .
