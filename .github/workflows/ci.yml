# READY-TO-APPLY workflow — copy this to .github/workflows/ci.yml (workflow scope; the loop can't).
# = the existing verify/mobile/build jobs + a REQUIRED `lint` (replaces the old non-blocking
# `quality`) + the new `journeys` gate (BUILDS != WORKS). After applying: push on a throwaway
# branch, confirm `lint` and `journeys` go GREEN, THEN add them to branch-protection required
# checks. Do NOT require `journeys` until you've seen it green (a red required check halts auto-merge).
name: CI

on:
  push:
    branches: ["claude/ai-apartment-design-app-iHAdb", main, develop]
    paths-ignore:
      - 'PENDING_OPS.md'
      - 'IMPROVEMENT_LOG.md'
      - 'ROADMAP.md'
      - 'docs/**'
  pull_request:

# Cancel superseded in-progress runs for the same PR — the autonomous loop pushes commits in rapid
# succession; without this every intermediate push ran full CI to completion. Only PR runs cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true   # was PR-only; push bursts never cancelled

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Determinism
        run: npx --yes tsx scripts/check-determinism.ts

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mobile gate (type/lint/test when /mobile exists)
        run: |
          if [ ! -f mobile/package.json ]; then
            echo "No /mobile app yet — mobile gate is a no-op (passes)."
            exit 0
          fi
          cd mobile
          npm install --no-audit --no-fund
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "No tsconfig.json — skipping type check."; fi
          npm run -s lint --if-present || echo "mobile lint: non-fatal issues (see logs)"
          npm test --if-present || echo "mobile tests: non-fatal issues (see logs)"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # NEW — required lint gate (eslint at zero; replaces the old non-blocking `quality`).
  # The loop keeps its own diff lint-clean; this stops a lint-dirty change auto-merging.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint .

  # SELF-VALIDATION gate: enforces validation/CAPABILITIES.yml — every external service the app
  # uses must be declared with HOW CI validates it. Fails closed on a new undeclared credential
  # (env drift) or when a PR touches a capability that needs an owner-only secret (scoped block).
  validate-capabilities:
    name: validate-capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to diff against the base for the scoped check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compute changed files (for the scoped unmet-capability check)
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || true
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            git cat-file -e "${base}^{commit}" 2>/dev/null || base="HEAD^"
          fi
          files=$(git diff --name-only "${base}...HEAD" 2>/dev/null || true)
          { echo "files<<__EOF__"; echo "$files"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
      - name: Validate capabilities
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/validate-capabilities.mjs

  # SECURITY INVARIANTS gate — RLS coverage + client-secret leak. This is the SAME script
  # scripts/preflight.sh calls, so the two can never drift.
  #
  # Why this job exists at all: `migrate` below auto-applies migrations to PROD on every push to
  # the default branch, and justifies dropping the human schema checkpoint by citing "the RLS gate
  # pre-merge". That gate lived ONLY inside preflight.sh, which no CI job runs — so the stated
  # mitigation did not exist mechanically, and a migration creating a public table without RLS
  # could merge and reach prod. Supabase exposes the whole public schema to the anon key via
  # PostgREST, so that is a live tenant-data leak. `migrate` now DEPENDS on this job.
  security-invariants:
    name: security-invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: RLS coverage + client-secret leak
        run: node scripts/check-security-invariants.mjs

  # GTM honesty gate (the GTM analog of validate-capabilities): fails closed if a GROWTH_STATUS
  # metric is reported with no connected source (fabrication risk), or the GTM scorecard is malformed.
  validate-gtm:
    name: validate-gtm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate GTM feeds
        run: node scripts/validate-gtm.mjs

  # NEW — functional JOURNEY gate (BUILDS != WORKS): replays real end-to-end user journeys
  # against a built app + an ephemeral Supabase-local DB and asserts intended outcomes.
  # Self-contained: `supabase start` provides the DB + keys (NO prod secrets needed).
  journeys:
    name: journeys
    runs-on: ubuntu-latest
    env:
      CI: "1"
      E2E_AUTH_STACK: "1"                       # run the AUTHENTICATED tier too (signup->dashboard, paywall)
      NEXT_PUBLIC_SITE_URL: "http://localhost:3100"
      PLAYWRIGHT_BASE_URL: "http://localhost:3100"
      E2E_RATE_LIMIT_BYPASS: "1"                # one CI IP would trip per-IP limits (code honors this; prod never sets it)
      # journeys don't call the LLMs; dummy non-empty keys satisfy the prod-boot env check
      # (lib/config/env.ts REQUIRED_PROD). Real Supabase URL/keys come from supabase-local below.
      GEMINI_API_KEY: "ci-dummy-not-used-by-journeys"
      DEEPSEEK_API_KEY: "ci-dummy-not-used-by-journeys"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start ephemeral Supabase + apply migrations
        run: |
          supabase start
          supabase db reset --no-seed
      - name: Export local Supabase keys (strip the quotes `status -o env` emits)
        run: |
          supabase status -o env > /tmp/sb.env
          sb_url=$(grep -E '^API_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          sb_anon=$(grep -E '^ANON_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          sb_srk=$(grep -E '^SERVICE_ROLE_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          echo "NEXT_PUBLIC_SUPABASE_URL=$sb_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$sb_anon" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$sb_srk" >> "$GITHUB_ENV"
          # DIAGNOSTIC: confirm the resolved values are sane (url present, keys non-empty).
          echo "resolved NEXT_PUBLIC_SUPABASE_URL=[$sb_url] anon_len=${#sb_anon} srk_len=${#sb_srk}"
      - name: Install deps + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start app + run journeys (public + authed)
        run: |
          npm run start -- -p 3100 > /tmp/app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3100/login && break; sleep 2; done
          if ! curl -sf -o /dev/null http://localhost:3100/login; then
            echo "::error::app did not become ready on :3100"; tail -150 /tmp/app.log; exit 1
          fi
          bash scripts/run-journeys.sh
      # a11y + public-pages specs run against the SAME served app — the expensive part (build,
      # ephemeral Supabase, browser install) is already paid for above, so this is nearly free.
      # They existed with npm scripts but no CI job invoked either, so neither had ever run:
      # a test nothing executes is not a gate, it only looks like one. run-journeys.sh runs
      # journeys.spec.ts and nothing else, which is exactly how the stale h1 regexes in
      # public-pages.spec.ts survived unnoticed.
      - name: Accessibility + public-pages specs (same served app)
        run: npx playwright test e2e/a11y.spec.ts e2e/public-pages.spec.ts
      - name: App server log (on failure)
        if: failure()
        run: tail -200 /tmp/app.log || true


  # Auto-migrate prod: after a change merges to the DEFAULT branch AND the gate is green, apply any
  # new supabase/migrations/* to prod (forward-only `db push`, NEVER a reset). Serialized. Skips
  # cleanly until the owner sets the three SUPABASE_* secrets, so it never reddens the branch during
  # setup. TRADEOFF: removes the human checkpoint on schema — mitigated by the 2-reviewer + RLS gate
  # pre-merge, default-branch-only, forward-only, and the `journeys` job first validating the FULL
  # migration chain on a throwaway DB. Enable Supabase PITR/backups before setting the secrets.
  migrate:
    name: migrate prod (auto-apply on push to default branch)
    needs: [verify, build, journeys, security-invariants]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/ai-apartment-design-app-iHAdb'
    runs-on: ubuntu-latest
    concurrency: migrate-prod-apt
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply new migrations to prod (forward-only; no-op if already applied)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD not all set —"
            echo "::warning::skipping auto-migrate. Add them in Settings → Secrets and variables → Actions,"
            echo "::warning::and enable Supabase PITR/backups first. Until then, migrations stay hand-applied."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
          echo "✅ prod migrations applied (forward-only)."
