# ARCHIVED — this was the proposal, and it has been APPLIED. Do NOT copy this file
# anywhere: `.github/workflows/ci.yml` is live, has run green, and has since moved
# AHEAD of this snapshot (it gained a `paths-ignore` list, a `concurrency` block that
# cancels superseded runs, and a `migrate` job — none of which are below).
#
# Kept only as the historical record of what was proposed and why. `.github/` is
# human-applied and the loop cannot edit it, so this file cannot be kept in sync and
# must not be treated as the source of truth. Read the real workflow instead.
name: CI

on:
  push:
    branches: ["claude/ai-apartment-design-app-iHAdb", main, develop]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Determinism
        run: npx --yes tsx scripts/check-determinism.ts

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mobile gate (type/lint/test when /mobile exists)
        run: |
          if [ ! -f mobile/package.json ]; then
            echo "No /mobile app yet — mobile gate is a no-op (passes)."
            exit 0
          fi
          cd mobile
          npm install --no-audit --no-fund
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "No tsconfig.json — skipping type check."; fi
          npm run -s lint --if-present || echo "mobile lint: non-fatal issues (see logs)"
          npm test --if-present || echo "mobile tests: non-fatal issues (see logs)"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # NEW — required lint gate (eslint at zero; replaces the old non-blocking `quality`).
  # The loop keeps its own diff lint-clean; this stops a lint-dirty change auto-merging.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint .

  # SELF-VALIDATION gate: enforces validation/CAPABILITIES.yml — every external service the app
  # uses must be declared with HOW CI validates it. Fails closed on a new undeclared credential
  # (env drift) or when a PR touches a capability that needs an owner-only secret (scoped block).
  validate-capabilities:
    name: validate-capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to diff against the base for the scoped check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compute changed files (for the scoped unmet-capability check)
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || true
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            git cat-file -e "${base}^{commit}" 2>/dev/null || base="HEAD^"
          fi
          files=$(git diff --name-only "${base}...HEAD" 2>/dev/null || true)
          { echo "files<<__EOF__"; echo "$files"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
      - name: Validate capabilities
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/validate-capabilities.mjs

  # GTM honesty gate (the GTM analog of validate-capabilities): fails closed if a GROWTH_STATUS
  # metric is reported with no connected source (fabrication risk), or the GTM scorecard is malformed.
  validate-gtm:
    name: validate-gtm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate GTM feeds
        run: node scripts/validate-gtm.mjs

  # NEW — functional JOURNEY gate (BUILDS != WORKS): replays real end-to-end user journeys
  # against a built app + an ephemeral Supabase-local DB and asserts intended outcomes.
  # Self-contained: `supabase start` provides the DB + keys (NO prod secrets needed).
  journeys:
    name: journeys
    runs-on: ubuntu-latest
    env:
      CI: "1"
      E2E_AUTH_STACK: "1"                       # run the AUTHENTICATED tier too (signup->dashboard, paywall)
      NEXT_PUBLIC_SITE_URL: "http://localhost:3100"
      PLAYWRIGHT_BASE_URL: "http://localhost:3100"
      E2E_RATE_LIMIT_BYPASS: "1"                # one CI IP would trip per-IP limits (code honors this; prod never sets it)
      # journeys don't call the LLMs; dummy non-empty keys satisfy the prod-boot env check
      # (lib/config/env.ts REQUIRED_PROD). Real Supabase URL/keys come from supabase-local below.
      GEMINI_API_KEY: "ci-dummy-not-used-by-journeys"
      DEEPSEEK_API_KEY: "ci-dummy-not-used-by-journeys"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start ephemeral Supabase + apply migrations
        run: |
          supabase start
          supabase db reset --no-seed
      - name: Export local Supabase keys (strip the quotes `status -o env` emits)
        run: |
          supabase status -o env > /tmp/sb.env
          sb_url=$(grep -E '^API_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          sb_anon=$(grep -E '^ANON_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          sb_srk=$(grep -E '^SERVICE_ROLE_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          echo "NEXT_PUBLIC_SUPABASE_URL=$sb_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$sb_anon" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$sb_srk" >> "$GITHUB_ENV"
          # DIAGNOSTIC: confirm the resolved values are sane (url present, keys non-empty).
          echo "resolved NEXT_PUBLIC_SUPABASE_URL=[$sb_url] anon_len=${#sb_anon} srk_len=${#sb_srk}"
      - name: Install deps + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start app + run journeys (public + authed)
        run: |
          npm run start -- -p 3100 > /tmp/app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3100/login && break; sleep 2; done
          if ! curl -sf -o /dev/null http://localhost:3100/login; then
            echo "::error::app did not become ready on :3100"; tail -150 /tmp/app.log; exit 1
          fi
          bash scripts/run-journeys.sh
      - name: App server log (on failure)
        if: failure()
        run: tail -200 /tmp/app.log || true
      - name: App server log (on failure)
        if: failure()
        run: tail -200 /tmp/app.log || true
